<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AlphaGRID Development Intelligence — explainable, regulation-cited development capacity analysis for parcels in Sri Lanka." />
    <title>AlphaGRID Development Intelligence</title>
  </head>
  <body>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("alphagrid-theme");
          var pref = stored === "light" || stored === "dark" || stored === "system" ? stored : "light";
          var resolved =
            pref === "system"
              ? window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
              : pref;
          document.documentElement.setAttribute("data-theme", resolved);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
